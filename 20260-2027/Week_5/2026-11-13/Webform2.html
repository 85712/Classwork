<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <title>Car Form</title>


    <style>
        body {
            font-family: Arial;
            background-color: #dceeff;
            margin: 0;
        }


        header {
            background-color: #164b78;
            color: white;
            text-align: center;
            padding: 20px;
        }


        main {
            background-color: white;
            margin: 30px;
            padding: 25px;
        }


        h1 {
            color: white;
        }


        label {
            font-weight: bold;
        }


        select {
            padding: 5px;
        }


        footer {
            background-color: #164b78;
            color: white;
            text-align: center;
            padding: 12px;
        }


        input[type="submit"] {
            background-color: #164b78;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>


<body>


<header>
    <h1>Car Selection Form</h1>
    <p>Find the perfect car for you!</p>
</header>


<main>


    <h2>Customize Your Car</h2>


    <form action="../posts/car_form.php" method="post">


        <label for="car">Choose a model car:</label>
        <select id="car" name="car" required>
            <option value="">Select a car</option>
            <option value="Toyota">Toyota Supra</option>
            <option value="Honda">Honda Pilot</option>
            <option value="Mercedes">Mercedes-S-Class</option>
            <option value="BMW">BMW M4</option>
            <option value="Ford">Ford Mustang</option>
            <option value="Ferrari">Ferrari 488</option>
            <option value="Cadillac">Black-Wing</option>
        </select>


        <br><br>


        <label for="range">Choose car range:</label>
        <input type="range" id="range" name="range"
               min="150" max="435" value="300"
               oninput="document.getElementById('range-output').value=this.value">


        <output id="range-output" for="range">300</output>


        <br><br>


        <label for="color">Choose a car color:</label>
        <select id="color" name="color" required>
            <option value="">Select a color</option>
            <option value="Black">Black</option>
            <option value="White">White</option>
            <option value="Red">Red</option>
            <option value="Blue">Blue</option>
            <option value="Silver">Silver</option>
        </select>


        <br><br>


        <input type="submit" value="Submit">


    </form>



</main>


<footer>
    <p> &copy Kelly's and Car Selection Form |This Survey is Being Recorded for Research Purposes!</p>
</footer>


</body>
</html>
